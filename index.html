<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naver Map Test</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=qb0c5ahrwa"></script>

    <script>
        const map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(37.5666102, 126.9783881),
            zoom: 12
        });
    </script>

</body>

</html>
