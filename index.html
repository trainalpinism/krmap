<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaverMap Trip Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="sidebar-header">
          <h1>Trip Pins</h1>
          <p>지도를 클릭해 여행 장소를 추가하세요.</p>
        </header>

        <section class="legend">
          <span class="dot"></span>
          <span>원형 번호 마커 자동 생성</span>
        </section>

        <section>
          <div class="section-title-row">
            <h2>장소 목록</h2>
            <span id="markerCount" class="count-chip">0</span>
          </div>
          <div id="markerList" class="marker-list" aria-live="polite"></div>
        </section>
      </aside>

      <main class="map-wrap">
        <div id="statusBanner" class="status-banner" hidden></div>
        <div id="map" aria-label="네이버 지도"></div>
      </main>
    </div>

    <template id="markerCardTemplate">
      <article class="marker-card">
        <div class="card-top">
          <div class="badge"></div>
          <button class="delete-btn" type="button">삭제</button>
        </div>

        <label>
          장소 이름
          <input class="name-input" type="text" maxlength="40" />
        </label>

        <label>
          아이콘 색상
          <select class="color-select">
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
            <option value="purple">Purple</option>
            <option value="orange">Orange</option>
          </select>
        </label>

        <label>
          마커 사진
          <input class="photo-input" type="file" accept="image/*" />
        </label>

        <div class="photo-preview empty">사진 없음</div>
      </article>
    </template>

    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=qb0c5ahrwa"></script>
    <script src="app.js"></script>
  </body>
</html>
